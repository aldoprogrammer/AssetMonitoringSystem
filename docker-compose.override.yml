# Local development overrides: live overlay sync (no rebuild/restart for app code).
# Loaded automatically by `docker compose` alongside docker-compose.yml.

services:
  identity-service:
    volumes:
      - ./services/identity-service/overlay:/opt/service-overlay:ro

  inventory-service:
    volumes:
      - ./services/inventory-service/overlay:/opt/service-overlay:ro

  assignment-service:
    volumes:
      - ./services/assignment-service/overlay:/opt/service-overlay:ro

  assignment-user-sync-worker:
    volumes:
      - ./services/assignment-service/overlay:/opt/service-overlay:ro

  health-monitor-service:
    volumes:
      - ./services/health-monitor-service/overlay:/opt/service-overlay:ro

  health-monitor-scanner:
    volumes:
      - ./services/health-monitor-service/overlay:/opt/service-overlay:ro

  audit-service:
    volumes:
      - ./services/audit-service/overlay:/opt/service-overlay:ro

  audit-consumer-worker:
    volumes:
      - ./services/audit-service/overlay:/opt/service-overlay:ro

  notification-service:
    volumes:
      - ./services/notification-service/overlay:/opt/service-overlay:ro

  notification-consumer-worker:
    volumes:
      - ./services/notification-service/overlay:/opt/service-overlay:ro
