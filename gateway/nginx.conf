worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker embedded DNS so upstreams can appear after gateway start.
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format asset_monitoring_system_json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request","status":$status,'
        '"request_time":$request_time,"upstream_addr":"$upstream_addr","upstream_response_time":"$upstream_response_time"}';

    access_log /var/log/nginx/access.log asset_monitoring_system_json;
    error_log /var/log/nginx/error.log warn;

    limit_req_zone $binary_remote_addr zone=asset_monitoring_system_api_limit:10m rate=25r/s;

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        location /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location /api/v1/identity/ {
            limit_req zone=asset_monitoring_system_api_limit burst=50 nodelay;
            set $identity_upstream identity-service:8000;
            rewrite ^/api/v1/identity/(.*)$ /api/v1/$1 break;
            proxy_pass http://$identity_upstream;
        }

        # Swagger/OpenAPI short paths for identity (same upstream as /api/v1/identity/*)
        location /api/v1/auth/ {
            limit_req zone=asset_monitoring_system_api_limit burst=50 nodelay;
            set $identity_upstream identity-service:8000;
            proxy_pass http://$identity_upstream;
        }

        location /api/v1/users {
            limit_req zone=asset_monitoring_system_api_limit burst=50 nodelay;
            set $identity_upstream identity-service:8000;
            proxy_pass http://$identity_upstream;
        }

        location /api/v1/employees {
            limit_req zone=asset_monitoring_system_api_limit burst=50 nodelay;
            set $identity_upstream identity-service:8000;
            proxy_pass http://$identity_upstream;
        }

        location /api/v1/inventory/ {
            limit_req zone=asset_monitoring_system_api_limit burst=50 nodelay;
            set $inventory_upstream inventory-service:8000;
            rewrite ^/api/v1/inventory/(.*)$ /api/v1/$1 break;
            proxy_pass http://$inventory_upstream;
        }

        location /api/v1/assignments/ {
            limit_req zone=asset_monitoring_system_api_limit burst=50 nodelay;
            set $assignment_upstream assignment-service:8000;
            rewrite ^/api/v1/assignments/(.*)$ /api/v1/assignments/$1 break;
            proxy_pass http://$assignment_upstream;
        }

        location = /api/v1/assignments {
            limit_req zone=asset_monitoring_system_api_limit burst=50 nodelay;
            set $assignment_upstream assignment-service:8000;
            proxy_pass http://$assignment_upstream/api/v1/assignments;
        }

        location /api/v1/health/ {
            limit_req zone=asset_monitoring_system_api_limit burst=50 nodelay;
            set $health_upstream health-monitor-service:8000;
            rewrite ^/api/v1/health/(.*)$ /api/v1/$1 break;
            proxy_pass http://$health_upstream;
        }

        location /api/v1/audit/ {
            limit_req zone=asset_monitoring_system_api_limit burst=30 nodelay;
            set $audit_upstream audit-service:8000;
            rewrite ^/api/v1/audit/(.*)$ /api/v1/$1 break;
            proxy_pass http://$audit_upstream;
        }

        location /api/v1/notifications/ {
            limit_req zone=asset_monitoring_system_api_limit burst=30 nodelay;
            set $notification_upstream notification-service:8000;
            rewrite ^/api/v1/notifications/(.*)$ /api/v1/$1 break;
            proxy_pass http://$notification_upstream;
        }

        location /identity/telescope {
            set $identity_upstream identity-service:8000;
            proxy_pass http://$identity_upstream;
        }

        location /inventory/telescope {
            set $inventory_upstream inventory-service:8000;
            proxy_pass http://$inventory_upstream;
        }

        location /assignments/telescope {
            set $assignment_upstream assignment-service:8000;
            proxy_pass http://$assignment_upstream;
        }

        location /health/telescope {
            set $health_upstream health-monitor-service:8000;
            proxy_pass http://$health_upstream;
        }

        location /audit/telescope {
            set $audit_upstream audit-service:8000;
            proxy_pass http://$audit_upstream;
        }

        location /notifications/telescope {
            set $notification_upstream notification-service:8000;
            proxy_pass http://$notification_upstream;
        }
    }
}
